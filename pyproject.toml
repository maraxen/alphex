[project]
name = "alphex"
# 0.1.0a1, not 0.1.0. The kernel is specced and tested, but the contract records real v0.2
# gaps -- degenerate and non-standard residue aliases (B/Z/J/U/O), the asset layer, the plugin
# registry -- and an alpha says so rather than implying they were considered and declined.
version = "0.1.0a1"
description = "Biological sequence alphabet orderings and letter-preserving conversions between them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marielle Russo", email = "67157875+maraxen@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["bioinformatics", "protein", "alphabet", "tokenizer", "esm", "proteinmpnn", "alphafold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# INTENTIONALLY MINIMAL -- see CLAUDE.md "The dependency contract".
#
# numpy is the only runtime dependency, and even that is a deliberate ceiling rather
# than a starting point. This package exists because the alternative homes for it
# (proxide, aminx, proteinsmc) all carry a base install that a consumer needing only
# alphabet conversions cannot afford: proxide's base pulls jax, jax-md, hydride, grain
# and array_record on top of a maturin-built Rust extension. Optional-dependency
# extras cannot fix that -- extras only ADD to a base install, they never subtract
# from it -- so the only way to make "just the alphabets" cheap is for it to be its
# own distribution. That is this one.
#
# Do NOT add jax here. Consumers that want jnp-backed permutation tables should get
# them by passing this package's plain integer arrays into their own jnp.asarray, or
# via a `jax` extra that stays strictly optional and lazily imported.
dependencies = [
    "numpy",
]

# Keep table headers BELOW every bare `[project]` key. A `[project.urls]` block placed above
# `dependencies` silently captures it, and the resulting error ("invalid type: sequence,
# expected a string") points at the list rather than at the header that swallowed it.
[project.urls]
Homepage = "https://github.com/maraxen/alphex"
Repository = "https://github.com/maraxen/alphex"
Issues = "https://github.com/maraxen/alphex/issues"

[project.optional-dependencies]
# Anything here must be imported only by a module that `alphex/__init__.py` does NOT
# import, and must fail with an actionable message naming the extra -- never with a
# bare ImportError. `alphex.cli` and `alphex.mcp` both do this; importing `alphex`
# itself still pulls nothing but numpy, which is the whole reason this package exists
# as its own distribution.
jax = ["jax"]
cli = ["cyclopts>=3"]
# The marker is load-bearing, and matches myxcel's precedent for the same dependency.
# cisternal requires Python >=3.13; alphex supports >=3.11 and must keep doing so, because a
# cheap install on the widest range of interpreters is the reason this package exists at all.
# Narrowing `requires-python` to satisfy an optional telemetry dependency would trade the
# package's purpose for a feature nobody needs to import the library.
#
# Consequence, stated rather than discovered: on 3.11/3.12 the `mcp` extra installs fastmcp
# but NOT cisternal, so `alphex-mcp` exits with the message in alphex/mcp.py naming the 3.13
# floor. The CLI has no such floor and works everywhere.
mcp = ["fastmcp>=2", "cisternal>=0.1.1a2; python_version >= '3.13'"]
agent = ["alphex[cli,mcp]"]

[project.scripts]
alphex = "alphex.cli:main"
alphex-mcp = "alphex.mcp:mcp_server"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.14",
    "ty>=0.0.1a21",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
  "TRY003",
  "EM101", "EM102",
  "CPY001",  # no copyright headers anywhere in this ecosystem
]

[tool.ruff.lint.per-file-ignores]
# T201: a command-line program's output IS print. Routing it through `logging` would send it
# to stderr and make `alphex perm ... | jq` stop working, which is the main way this surface
# is meant to be used.
"src/alphex/cli.py" = ["T201"]
# CLI scripts print to stdout by design, are not an importable package, and their
# report-building main() is a flat sequence rather than genuinely branchy.
"scripts/*.py" = ["T201", "INP001", "C901"]
# Tests assert (that is their job) and compare against literal indices from the census,
# which are the values under test -- extracting them to constants would hide the thing
# being asserted behind a name.
# D103: test names here are full sentences (`test_declaration_rejects_duplicate_symbols`),
# so a docstring restating the name is noise. Tests whose *reason for existing* is
# non-obvious -- the ones guarding a specific past defect -- carry a docstring anyway.
"tests/*.py" = ["S101", "PLR2004", "INP001", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
