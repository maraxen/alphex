name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        # Extras included so `alphex.cli` and `alphex.mcp` are type-checked rather than skipped.
        # cisternal is still absent below 3.13 (its own floor, marker-gated in the `mcp` extra);
        # that one import carries a targeted suppression in mcp.py.
        run: uv sync --extra cli --extra mcp --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Type-check
        run: uv run ty check src/alphex

      - name: Test
        run: uv run pytest -q
